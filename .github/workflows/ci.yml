name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Daftari.sln

      - name: Build
        run: dotnet build Daftari.sln -c Release --no-restore

      - name: Test
        run: dotnet test Daftari.sln -c Release --no-build --verbosity normal

      # يتأكد أن النسخة المستقلة (التي يشير إليها اختصار المستخدم) ما زالت تُبنى
      - name: Verify self-contained publish
        run: dotnet publish Daftari.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-check
